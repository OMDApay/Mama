<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدعية على روح أمي الغالية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700&family=Cairo:wght@400;600;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --gold:#b8860b; --gold-l:#d4a017; --gold-ll:#e8c060;
  --brown:#6b4226; --dark:#2c1a0e; --bg:#f5ede0;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Amiri','Cairo',sans-serif;
  background:var(--bg);
  min-height:100vh; overflow-x:hidden; position:relative;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23b8860b' stroke-width='0.4' opacity='0.07'%3E%3Cpath d='M30 0L60 15L60 45L30 60L0 45L0 15Z'/%3E%3Ccircle cx='30' cy='30' r='10'/%3E%3C/g%3E%3C/svg%3E");
}

/* particles */
.pc{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.pt{position:absolute;border-radius:50%;opacity:0;animation:fup linear infinite;}
@keyframes fup{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:.5;}90%{opacity:.1;}100%{transform:translateY(-80px) scale(1);opacity:0;}}

.pw{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 70px;}

/* ── HEADER ── */
.hdr{text-align:center;padding:38px 20px 26px;}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
.orl{flex:1;height:1px;max-width:180px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.ord{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);animation:pg 2.2s ease-in-out infinite;}
@keyframes pg{0%,100%{transform:rotate(45deg) scale(1);opacity:1;}50%{transform:rotate(45deg) scale(1.5);opacity:.55;}}

.basmala{font-family:'Amiri',serif;font-size:clamp(1.4rem,3.5vw,2.3rem);color:var(--gold);margin-bottom:12px;}

.verse{
  display:inline-block;
  font-family:'Amiri',serif;font-size:clamp(.95rem,2vw,1.25rem);
  color:var(--brown);line-height:2;
  border-top:1px solid rgba(184,134,11,.25);border-bottom:1px solid rgba(184,134,11,.25);
  padding:10px 22px;margin-bottom:16px;
}

.tline{font-family:'Cairo',sans-serif;font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:600;color:var(--dark);}
.tmama{
  display:block;
  font-family:'Aref Ruqaa','Amiri',serif;
  font-size:clamp(3rem,8vw,5.5rem);font-weight:700;
  color:var(--gold);line-height:1.05;margin-top:4px;
  animation:shim 3s ease-in-out infinite;
}
@keyframes shim{0%,100%{text-shadow:0 2px 10px rgba(184,134,11,.2);}50%{text-shadow:0 2px 28px rgba(184,134,11,.55);}}

/* ── CONTROLS ── */
.ctrl{
  background:rgba(255,255,255,.72);border:1px solid rgba(184,134,11,.22);
  border-radius:14px;padding:13px 18px;margin-bottom:18px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  backdrop-filter:blur(8px);
}
.sgrp{display:flex;gap:8px;flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(184,134,11,.38);background:rgba(184,134,11,.08);
  color:var(--brown);font-family:'Cairo',sans-serif;font-size:13px;
  transition:all .2s;white-space:nowrap;
}
.btn:hover{background:rgba(184,134,11,.2);border-color:var(--gold);transform:translateY(-1px);}
.btn.pri{background:var(--gold);color:#fff;font-weight:700;border-color:var(--gold);}
.btn.pri:hover{background:var(--gold-l);}
.btn.dan{border-color:rgba(170,50,50,.35);color:#aa3333;background:rgba(170,50,50,.07);}
.scnt{font-size:13px;color:#777;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;border:1px solid rgba(0,0,0,.08);}

/* ── PLAYLIST BAR ── */
.plbar{
  background:rgba(184,134,11,.07);border:1px solid rgba(184,134,11,.28);
  border-radius:14px;padding:12px 18px;margin-bottom:18px;
  display:none;flex-wrap:wrap;gap:10px;align-items:center;
}
.plbar.on{display:flex;}
.plinfo{font-family:'Amiri',serif;font-size:15px;color:var(--brown);flex:1;}
.plprog{font-size:12px;color:#999;min-width:65px;text-align:center;}
.spkind{display:none;align-items:center;gap:2px;}
.plbar.on .spkind{display:flex;}
.sb{width:3px;background:var(--gold);border-radius:2px;animation:bd .8s ease-in-out infinite;}
.sb:nth-child(1){height:8px;}.sb:nth-child(2){height:14px;animation-delay:.15s;}.sb:nth-child(3){height:10px;animation-delay:.3s;}
@keyframes bd{0%,100%{transform:scaleY(.5);}50%{transform:scaleY(1.2);}}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}

/* ── CARD ── */
.card{
  background:rgba(255,255,255,.78);border:1px solid rgba(184,134,11,.18);
  border-radius:18px;overflow:hidden;position:relative;
  transition:all .3s;animation:ca .5s ease both;
  box-shadow:0 2px 14px rgba(0,0,0,.06);backdrop-filter:blur(5px);
}
@keyframes ca{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.card:hover{transform:translateY(-2px);border-color:rgba(184,134,11,.45);box-shadow:0 8px 28px rgba(0,0,0,.11);}
.card.sel{border-color:var(--gold);background:rgba(255,248,226,.92);box-shadow:0 0 0 2px rgba(184,134,11,.22);}
.card.play{border-color:#c17f3a;background:rgba(255,245,220,.96);animation:pp 2s ease-in-out infinite;}
@keyframes pp{0%,100%{box-shadow:0 0 14px rgba(193,127,58,.18);}50%{box-shadow:0 0 28px rgba(193,127,58,.38);}}

/* checkbox */
.chkw{position:absolute;top:12px;left:12px;z-index:5;}
.chkw input{width:18px;height:18px;cursor:pointer;accent-color:var(--gold);}

/* card header */
.chdr{
  padding:11px 13px 8px 40px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid rgba(184,134,11,.1);background:rgba(184,134,11,.04);
}
.dnum{font-size:11px;color:var(--brown);font-weight:700;background:rgba(184,134,11,.1);border:1px solid rgba(184,134,11,.22);border-radius:20px;padding:3px 9px;white-space:nowrap;}
.dcat{font-size:11px;color:#999;flex:1;text-align:left;}
.cpind{display:none;align-items:center;gap:2px;}
.play .cpind{display:flex;}
.cpb{width:3px;background:var(--gold);border-radius:2px;animation:bd .8s ease-in-out infinite;}
.cpb:nth-child(1){height:7px;}.cpb:nth-child(2){height:12px;animation-delay:.15s;}.cpb:nth-child(3){height:8px;animation-delay:.3s;}

/* progress */
.aprw{margin:5px 13px 0;display:none;}
.play .aprw{display:block;}
.aprb{width:100%;height:3px;background:rgba(184,134,11,.15);border-radius:2px;overflow:hidden;}
.aprf{height:100%;background:var(--gold);width:0%;transition:width .25s;border-radius:2px;}

/* card body */
.cbody{padding:14px 16px;}
.arabic{
  font-family:'Amiri',serif;
  font-size:clamp(1.1rem,2.4vw,1.32rem);
  color:var(--dark);line-height:2.15;
  text-align:center;direction:rtl;
  min-height:68px;
}

/* card actions */
.cact{padding:9px 13px 12px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid rgba(184,134,11,.1);}
.abtn{
  display:flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:7px;cursor:pointer;
  border:1px solid rgba(0,0,0,.1);background:rgba(0,0,0,.03);
  color:#666;font-family:'Cairo',sans-serif;font-size:12px;
  transition:all .2s;
}
.abtn:hover{background:rgba(0,0,0,.08);color:#333;}
.abtn svg{width:13px;height:13px;flex-shrink:0;}
.abtn.pbtn{border-color:rgba(184,134,11,.28);color:var(--brown);background:rgba(184,134,11,.07);flex:1;justify-content:center;}
.abtn.pbtn:hover{background:rgba(184,134,11,.18);}
.abtn.pbtn.on{background:rgba(184,134,11,.2);border-color:var(--gold);font-weight:700;}
.abtn.dbtn{border-color:rgba(184,134,11,.22);color:var(--brown);background:rgba(184,134,11,.05);}
.abtn.dbtn:hover{background:rgba(184,134,11,.14);}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;
  transform:translateX(-50%) translateY(120px);
  background:rgba(44,26,14,.93);border:1px solid var(--gold);
  color:var(--gold-ll);padding:11px 22px;border-radius:10px;
  font-size:14px;z-index:9999;transition:transform .3s;white-space:nowrap;
  backdrop-filter:blur(10px);
}
.toast.on{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;gap:12px;}
  .ctrl{flex-direction:column;}
  .sgrp{width:100%;}
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(184,134,11,.35);border-radius:3px;}
</style>
</head>
<body>

<div class="pc" id="pc"></div>

<div class="pw">

  <!-- HEADER -->
  <div class="hdr">
    <div class="orn">
      <div class="orl"></div>
      <div class="ord"></div>
      <div class="ord" style="width:6px;height:6px;margin:0 3px;"></div>
      <div class="ord"></div>
      <div class="orl"></div>
    </div>

    <div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

    <div class="verse">
      ﴿ يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً فَادْخُلِي فِي عِبَادِي وَادْخُلِي جَنَّتِي ﴾
    </div>

    <div class="tline">
      أدعية على روح
      <span class="tmama">أُمِّي</span>
      الغالية
    </div>

    <div class="orn" style="margin-top:18px;margin-bottom:0;">
      <div class="orl"></div>
      <div class="ord"></div>
      <div class="orl"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="ctrl">
    <div class="sgrp">
      <button class="btn" onclick="selAll()">✓ تحديد الكل</button>
      <button class="btn dan" onclick="clrAll()">✕ إلغاء الكل</button>
    </div>
    <div class="scnt" id="scnt">لم يُحدَّد شيء</div>
    <button class="btn pri" onclick="playSelected()" id="playBtn" style="display:none">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      تشغيل المحددة
    </button>
    <button class="btn" onclick="stopAll()" id="stopBtn" style="display:none">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
      إيقاف
    </button>
  </div>

  <!-- PLAYLIST BAR -->
  <div class="plbar" id="plbar">
    <div class="spkind"><div class="sb"></div><div class="sb"></div><div class="sb"></div></div>
    <div class="plinfo" id="plinfo">جارٍ التشغيل...</div>
    <div class="plprog" id="plprog">1 / 1</div>
    <button class="btn" onclick="prevD()">⟨ السابق</button>
    <button class="btn" onclick="nextD()">التالي ⟩</button>
  </div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

// ── STATE ──────────────────────────────────────────────────────────────────
const sel = new Set();
let playlist=[], pIdx=0, pActive=false;
let utt=null, curId=null, progInt=null, keepInt=null;

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  const g=document.getElementById('grid'); g.innerHTML='';
  DUAS.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='card'; el.id='c'+d.id;
    el.style.animationDelay=(i*.04)+'s';
    el.innerHTML=
      '<label class="chkw"><input type="checkbox" onchange="toggle('+d.id+',this.checked)"/></label>'+
      '<div class="chdr">'+
        '<div class="dnum">'+d.n+'</div>'+
        '<div class="dcat">'+d.c+'</div>'+
        '<div class="cpind"><div class="cpb"></div><div class="cpb"></div><div class="cpb"></div></div>'+
      '</div>'+
      '<div class="aprw"><div class="aprb"><div class="aprf" id="p'+d.id+'"></div></div></div>'+
      '<div class="cbody"><div class="arabic">'+d.t+'</div></div>'+
      '<div class="cact">'+
        '<button class="abtn pbtn" id="b'+d.id+'" onclick="tspeak('+d.id+')">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>استمع</button>'+
        '<button class="abtn dbtn" onclick="dlImg('+d.id+')" title="تحميل البطاقة كصورة">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>صورة</button>'+
        '<button class="abtn dbtn" onclick="dlSpeak('+d.id+')" title="تشغيل الدعاء صوتياً">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>صوت</button>'+
      '</div>';
    g.appendChild(el);
  });
}

// ── SELECT ─────────────────────────────────────────────────────────────────
function toggle(id,v){
  v?sel.add(id):sel.delete(id);
  document.getElementById('c'+id)?.classList.toggle('sel',v);
  updUI();
}
function selAll(){
  DUAS.forEach(d=>sel.add(d.id));
  document.querySelectorAll('.chkw input').forEach(x=>x.checked=true);
  document.querySelectorAll('.card').forEach(c=>c.classList.add('sel'));
  updUI();
}
function clrAll(){
  sel.clear();
  document.querySelectorAll('.chkw input').forEach(x=>x.checked=false);
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
  updUI();
}
function updUI(){
  const n=sel.size;
  document.getElementById('scnt').textContent=
    n===0?'لم يُحدَّد شيء':n===DUAS.length?'تم تحديد الكل ('+n+')':'تم تحديد '+n+' دعاء';
  document.getElementById('playBtn').style.display=n>0?'inline-flex':'none';
}

// ── SPEECH ─────────────────────────────────────────────────────────────────
function arVoice(){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>v.lang==='ar-SA')||vs.find(v=>v.lang.startsWith('ar'))||null;
}

function killSpeech(){
  clearInterval(progInt); clearInterval(keepInt);
  if(window.speechSynthesis) speechSynthesis.cancel();
  utt=null;
}

function speakText(text, id, cb){
  if(!window.speechSynthesis){toast('المتصفح لا يدعم الصوت');return;}
  killSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ar-SA'; u.rate=0.82; u.pitch=1; u.volume=1;
  const v=arVoice(); if(v) u.voice=v;
  utt=u;

  // progress bar
  const bar=document.getElementById('p'+id);
  let prog=0;
  progInt=setInterval(()=>{
    if(!utt){clearInterval(progInt);return;}
    prog=Math.min(prog+.5,97);
    if(bar) bar.style.width=prog+'%';
  },100);

  u.onend=()=>{
    clearInterval(progInt); clearInterval(keepInt);
    if(bar){bar.style.width='100%';setTimeout(()=>{bar.style.width='0%';},500);}
    utt=null; if(cb) cb();
  };
  u.onerror=()=>{
    clearInterval(progInt); clearInterval(keepInt);
    if(bar) bar.style.width='0%';
    utt=null; if(cb) cb();
  };

  // speak — handle async voice loading
  const doSpeak=()=>{
    const vv=arVoice(); if(vv) u.voice=vv;
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.getVoices().length===0){
    speechSynthesis.onvoiceschanged=doSpeak;
  } else {
    doSpeak();
  }

  // Chrome background-tab resumption fix
  keepInt=setInterval(()=>{
    if(!utt){clearInterval(keepInt);return;}
    if(speechSynthesis.paused) speechSynthesis.resume();
  },4000);
}

function setPlaying(id){
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.remove('play');
    const b=c.querySelector('.pbtn');
    if(b){b.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M8 5v14l11-7z"/></svg>استمع';b.classList.remove('on');}
  });
  curId=id;
  if(!id) return;
  const card=document.getElementById('c'+id);
  if(card){card.classList.add('play');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const b=document.getElementById('b'+id);
  if(b){b.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><rect x="6" y="6" width="4" height="12"/><rect x="14" y="6" width="4" height="12"/></svg>إيقاف';b.classList.add('on');}
}

function tspeak(id){
  if(curId===id&&(speechSynthesis.speaking||speechSynthesis.pending)){stopAll();return;}
  pActive=false; killSpeech(); setPlaying(id);
  const d=DUAS.find(x=>x.id===id);
  if(d) speakText(d.t, id, ()=>{ if(!pActive) setPlaying(null); });
}

function dlSpeak(id){
  const d=DUAS.find(x=>x.id===id);
  if(!d) return;
  toast('جارٍ تشغيل الدعاء صوتياً...');
  pActive=false; killSpeech(); setPlaying(id);
  speakText(d.t, id, ()=>setPlaying(null));
}

// ── PLAYLIST ───────────────────────────────────────────────────────────────
function playSelected(){
  playlist=DUAS.filter(d=>sel.has(d.id));
  if(!playlist.length) return;
  pIdx=0; pActive=true;
  document.getElementById('plbar').classList.add('on');
  document.getElementById('stopBtn').style.display='inline-flex';
  playNext();
}
function playNext(){
  if(!pActive||pIdx>=playlist.length){stopAll();return;}
  const d=playlist[pIdx];
  setPlaying(d.id);
  document.getElementById('plinfo').textContent=d.n+' — '+d.c;
  document.getElementById('plprog').textContent=(pIdx+1)+' / '+playlist.length;
  speakText(d.t, d.id, ()=>{ pIdx++; setTimeout(playNext, 600); });
}
function prevD(){ if(pIdx>1){pIdx-=2;killSpeech();setTimeout(playNext,150);} }
function nextD(){ killSpeech(); setTimeout(playNext,150); }
function stopAll(){
  pActive=false; killSpeech(); setPlaying(null);
  document.getElementById('plbar').classList.remove('on');
  document.getElementById('stopBtn').style.display='none';
  playlist=[];
}

// ── DOWNLOAD IMAGE ─────────────────────────────────────────────────────────
function dlImg(id){
  const d=DUAS.find(x=>x.id===id);
  if(!d) return;
  toast('جارٍ إنشاء البطاقة...');

  // Build offscreen container
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;top:-9999px;right:-9999px;width:900px;height:1200px;overflow:hidden;direction:rtl;';

  // Use canvas to draw — avoid html2canvas RTL issues with fonts
  // Instead, build a clean div with explicit text rendering
  wrap.innerHTML=
    '<div id="dlinner" style="'+
      'width:900px;height:1200px;position:relative;overflow:hidden;'+
      'background:#f5ede0;font-family:Amiri,serif;direction:rtl;'+
    '">'+
      '<img id="dlbg" src="'+BG+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;" crossorigin="anonymous"/>'+
      '<div style="'+
        'position:absolute;top:0;left:0;right:0;bottom:0;'+
        'display:flex;align-items:center;justify-content:center;'+
        'padding:0 60px 220px;'+
      '">'+
        '<div style="'+
          'background:rgba(255,255,255,0.82);'+
          'border:2.5px solid rgba(184,134,11,0.4);'+
          'border-radius:24px;'+
          'padding:38px 50px 42px;'+
          'width:100%;max-width:740px;'+
          'text-align:center;direction:rtl;'+
          'box-shadow:0 4px 32px rgba(0,0,0,0.1);'+
        '">'+
          // top ornament
          '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;">'+
            '<div style="flex:1;height:1px;background:linear-gradient(to right,transparent,#b8860b,transparent);"></div>'+
            '<div style="width:8px;height:8px;background:#b8860b;transform:rotate(45deg);"></div>'+
            '<div style="flex:1;height:1px;background:linear-gradient(to right,#b8860b,transparent,#b8860b);"></div>'+
          '</div>'+
          '<div style="font-size:13px;color:#888;font-family:Cairo,sans-serif;font-weight:600;margin-bottom:5px;">'+d.n+'</div>'+
          '<div style="font-size:12px;color:#b8860b;font-family:Cairo,sans-serif;margin-bottom:22px;">'+d.c+'</div>'+
          // Arabic text — NO unicode-bidi override, proper RTL
          '<div style="'+
            'font-family:Amiri,serif;'+
            'font-size:27px;'+
            'color:#2c1a0e;'+
            'line-height:2.4;'+
            'direction:rtl;'+
            'text-align:center;'+
          '">'+d.t+'</div>'+
          // bottom separator
          '<div style="margin-top:22px;display:flex;align-items:center;justify-content:center;gap:10px;">'+
            '<div style="flex:1;height:1px;background:linear-gradient(to right,transparent,#b8860b,transparent);"></div>'+
            '<div style="font-size:16px;color:#b8860b;">✦</div>'+
            '<div style="flex:1;height:1px;background:linear-gradient(to right,#b8860b,transparent);"></div>'+
          '</div>'+
          '<div style="margin-top:14px;font-family:Amiri,serif;font-size:15px;color:#b8860b;">'+
            'اللَّهُمَّ ارْحَمْهَا كَمَا رَبَّتْنِي صَغِيرًا ❤'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';

  document.body.appendChild(wrap);

  const inner=wrap.querySelector('#dlinner');
  const bgImg=wrap.querySelector('#dlbg');

  const doCapture=()=>{
    // Give fonts time to render
    setTimeout(()=>{
      html2canvas(inner,{
        scale:2, useCORS:true, allowTaint:true,
        backgroundColor:'#f5ede0',
        logging:false, width:900, height:1200,
        onclone:(doc)=>{
          // Ensure Arabic text direction is preserved in clone
          doc.querySelectorAll('[style]').forEach(el=>{
            if(el.style.direction==='rtl') el.setAttribute('dir','rtl');
          });
        }
      }).then(canvas=>{
        const a=document.createElement('a');
        a.download='دعاء-'+d.id+'-'+d.c+'.png';
        a.href=canvas.toDataURL('image/png');
        a.click();
        document.body.removeChild(wrap);
        toast('تم تحميل البطاقة بنجاح ✓');
      }).catch(()=>{
        document.body.removeChild(wrap);
        toast('تعذّر إنشاء الصورة — حاول مرة أخرى');
      });
    }, 400);
  };

  // base64 images fire onload immediately in some browsers, not others
  if(bgImg.complete && bgImg.naturalWidth>0){
    doCapture();
  } else {
    bgImg.onload=doCapture;
    bgImg.onerror=()=>{
      // fallback: capture without background loaded
      doCapture();
    };
  }
}

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastTimer=null;
function toast(msg){
  clearTimeout(toastTimer);
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  toastTimer=setTimeout(()=>t.classList.remove('on'),3200);
}

// ── PARTICLES ──────────────────────────────────────────────────────────────
function initParticles(){
  const c=document.getElementById('pc');
  const cols=['#b8860b','#d4a017','#e8c060','#c8a870','#8fbc8f'];
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='pt';
    const sz=Math.random()*4+2;
    p.style.cssText=
      'left:'+Math.random()*100+'vw;'+
      'width:'+sz+'px;height:'+sz+'px;'+
      'background:'+cols[i%cols.length]+';'+
      'animation-duration:'+(Math.random()*14+8)+'s;'+
      'animation-delay:'+(Math.random()*12)+'s;';
    c.appendChild(p);
  }
}

// ── INIT ───────────────────────────────────────────────────────────────────
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
render();
initParticles();
</script>
